# siftly web (x.ace) container. Side-by-side by default: 127.0.0.1:13000, live launchd unit keeps *:3000.
# Run from this directory:
#   SIFTLY_PRISMA_DIR=<dir holding dev.db> docker compose up -d --build
# See README.md for the side-by-side snapshot recipe and the cutover/rollback steps.
name: siftly-web

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: siftly-web:local
    container_name: siftly-web
    restart: unless-stopped
    ports:
      # host bind; cutover sets SIFTLY_BIND=0.0.0.0:3000
      - "${SIFTLY_BIND:-127.0.0.1:13000}:3000"
    env_file:
      # Optional runtime secrets (OPENAI_API_KEY, X_OAUTH_CLIENT_ID/SECRET, SIFTLY_TRANSLATE_*),
      # rendered from 1Password OUTSIDE the repo. Never commit it, never bake it in.
      - path: "${SIFTLY_ENV_FILE:-/dev/null}"
        required: false
    environment:
      # The index greeting ("Good afternoon") is server-rendered from local time; match the host.
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      # Directory holding dev.db. The web process WRITES to it (settings, categories,
      # imports, categorize), so side-by-side mounts a SNAPSHOT copy; only cutover mounts the live dir.
      - "${SIFTLY_PRISMA_DIR:?set SIFTLY_PRISMA_DIR to the directory holding dev.db}:/data/prisma"
      # tweet syndication cache (lib/tweet-cache.ts, read+write). Default: container-owned named
      # volume; set SIFTLY_LOCAL_DIR to a directory holding tweet-cache.db to reuse one.
      - "${SIFTLY_LOCAL_DIR:-tweet_cache}:/data/local"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  tweet_cache:
